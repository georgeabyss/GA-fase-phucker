# Builds the Windows VST3 on GitHub's own machines, on every push to main (or by hand: Actions > Build >
# Run workflow); the zip is under the run's "Artifacts". JUCE is the version the framework pins.
# The Mac plug-ins are built locally (faster), as for Hyper! Hyper! Dimension.
name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # framework/ (ga-framework)

      - name: Get JUCE (the version the framework pins)
        shell: bash
        run: git clone --depth 1 --branch "$(cat framework/cmake/juce-version.txt)" https://github.com/juce-framework/JUCE.git ../JUCE

      - name: Build
        run: |
          cmake -B build
          cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'FasePhucker VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/FasePhucker_artefacts/Release/VST3/*.vst3" -DestinationPath "dist/FasePhucker-$version-Windows-VST3.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FasePhucker-Windows-VST3
          path: dist/*.zip
